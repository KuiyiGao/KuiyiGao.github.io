<svg xmlns="http://www.w3.org/2000/svg" id="mmsafeaware-workflow" width="260" height="214" viewBox="0 0 260 214" role="img" aria-labelledby="title desc">
<title id="title">MMSafeAware: Study workflow</title>
<desc id="desc">Study workflow: a model judges an image–text pair, then its accuracy is evaluated separately on unsafe and benign inputs. Newly drawn schematic; no new measurements.</desc>
<rect id="background" width="260" height="214" fill="#fff"/>
<text id="study-workflow-label" x="18" y="21" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#607080" font-weight="400">Study workflow</text>
<g id="node-input"><rect id="box-input" x="18" y="35" width="224" height="42" rx="3" fill="#f8fafb" stroke="#b8c3cc" stroke-width="1"/>
<text id="label-input" x="130.0" y="61" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#273746" font-weight="400">Image + text pair</text>
</g>
<g id="edge-input-judgement" stroke="#80909e" stroke-width="1.35" fill="none"><path d="M 130 81 L 130 88"/><path d="M 126.6 84.2 L 130 88 L 133.4 84.2"/></g>
<g id="node-judgement"><rect id="box-judgement" x="18" y="93" width="224" height="42" rx="3" fill="#f8fafb" stroke="#b8c3cc" stroke-width="1"/>
<text id="label-judgement" x="130.0" y="119" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#273746" font-weight="400">Safety judgement</text>
</g>
<g id="edge-judgement-evaluation" stroke="#80909e" stroke-width="1.35" fill="none"><path d="M 130 139 L 130 146"/><path d="M 126.6 142.2 L 130 146 L 133.4 142.2"/></g>
<g id="node-evaluation"><rect id="box-evaluation" x="18" y="151" width="224" height="42" rx="3" fill="#f1f6f5" stroke="#b8c3cc" stroke-width="1"/>
<text id="label-evaluation" x="130.0" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#273746" font-weight="400">Unsafe / benign</text>
<text id="subtitle-evaluation" x="130.0" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#607080" font-weight="400">accuracy by subset</text>
</g>
</svg>
