<svg xmlns="http://www.w3.org/2000/svg" width="300" height="566" viewBox="0 0 300 566" role="img" aria-labelledby="memslot-workflow-mobile-title memslot-workflow-mobile-desc">
<title id="memslot-workflow-mobile-title">MemSlot workflow</title>
<desc id="memslot-workflow-mobile-desc">Contract text is scored by memory-slot attention over frozen RoBERTa features. Saliency guides word selection and page rendering. OCR produces decoded text for a separate QA reader. End-to-end QA evaluation is unfinished.</desc>
<rect width="300" height="566" fill="#ffffff"/>
<rect x="16" y="14" width="268" height="82" rx="6" fill="#f4f7f9"/>
<text x="150" y="45" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#23445a">Contract text</text>
<text x="150" y="72" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#525f69">Text input</text>
<path d="M 150 101 V 110 M 146 106 L 150 110 L 154 106" fill="none" stroke="#7f929f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="114" width="268" height="82" rx="6" fill="#f4f7f9"/>
<text x="150" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#23445a">MemSlot saliency</text>
<text x="150" y="172" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#525f69">Frozen RoBERTa + learned slots</text>
<path d="M 150 201 V 210 M 146 206 L 150 210 L 154 206" fill="none" stroke="#7f929f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="214" width="268" height="82" rx="6" fill="#f4f7f9"/>
<text x="150" y="245" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#23445a">Selection + rendering</text>
<text x="150" y="272" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#525f69">Page images</text>
<path d="M 150 301 V 310 M 146 306 L 150 310 L 154 306" fill="none" stroke="#7f929f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="314" width="268" height="82" rx="6" fill="#f4f7f9"/>
<text x="150" y="345" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#23445a">OCR-decoded text</text>
<text x="150" y="372" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#525f69">Text output</text>
<path d="M 150 401 V 410 M 146 406 L 150 410 L 154 406" fill="none" stroke="#7f929f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="414" width="268" height="82" rx="6" fill="#f4f7f9"/>
<text x="150" y="445" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#23445a">Separate QA reader</text>
<text x="150" y="472" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#525f69">Text + question</text>
<text x="16" y="527" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#626b73">End-to-end QA evaluation</text>
<text x="16" y="548" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#626b73">unfinished.</text>
