<title id="poetry-workflow-mobile-title">Poetry and image variation workflow</title>
<desc id="poetry-workflow-mobile-desc">Poem excerpts prompt FLUX and Stable Diffusion to produce images. Archived CLIP-based variation scores support poem-level comparisons and prompt-length analysis. The workflow describes a course study, not a causal or literary conclusion.</desc>
