<svg xmlns="http://www.w3.org/2000/svg" id="coj-workflow" width="260" height="214" viewBox="0 0 260 214" role="img" aria-labelledby="title desc">
<title id="title">Chain-of-Jailbreak: Study workflow</title>
<desc id="desc">Study workflow: outputs from an image-editing session are evaluated for safety, then results are compared across models and scenarios. Newly drawn schematic; no new measurements.</desc>
<rect id="background" width="260" height="214" fill="#fff"/>
<text id="study-workflow-label" x="18" y="21" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#607080" font-weight="400">Study workflow</text>
<g id="node-session"><rect id="box-session" x="18" y="35" width="224" height="42" rx="3" fill="#f8fafb" stroke="#b8c3cc" stroke-width="1"/>
<text id="label-session" x="130.0" y="61" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#273746" font-weight="400">Image-editing session</text>
</g>
<g id="edge-session-evaluation" stroke="#80909e" stroke-width="1.35" fill="none"><path d="M 130 81 L 130 88"/><path d="M 126.6 84.2 L 130 88 L 133.4 84.2"/></g>
<g id="node-evaluation"><rect id="box-evaluation" x="18" y="93" width="224" height="42" rx="3" fill="#f8fafb" stroke="#b8c3cc" stroke-width="1"/>
<text id="label-evaluation" x="130.0" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#273746" font-weight="400">Evaluate outputs</text>
<text id="subtitle-evaluation" x="130.0" y="126" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#607080" font-weight="400">safety assessment</text>
</g>
<g id="edge-evaluation-comparison" stroke="#80909e" stroke-width="1.35" fill="none"><path d="M 130 139 L 130 146"/><path d="M 126.6 142.2 L 130 146 L 133.4 142.2"/></g>
<g id="node-comparison"><rect id="box-comparison" x="18" y="151" width="224" height="42" rx="3" fill="#f1f6f5" stroke="#b8c3cc" stroke-width="1"/>
<text id="label-comparison" x="130.0" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#273746" font-weight="400">Compare results</text>
<text id="subtitle-comparison" x="130.0" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#607080" font-weight="400">models and scenarios</text>
</g>
</svg>
